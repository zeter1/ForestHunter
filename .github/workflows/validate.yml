name: Validate

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "index.html"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: JavaScript syntax
        shell: bash
        run: |
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check scripts/validate-structure.mjs
          node --check tests/contracts.mjs
          node --check tests/scenarios.mjs

      - name: Project structure
        run: node scripts/validate-structure.mjs

      - name: Gameplay contract tests
        run: node tests/contracts.mjs

      - name: Deterministic replay scenarios
        run: node tests/scenarios.mjs

      - name: Browser boot smoke
        shell: bash
        run: |
          python3 -m http.server 8000 > /tmp/forest-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep 0.25
          done

          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then echo "Chrome/Chromium is not installed on the runner."; exit 1; fi

          "$chrome"             --headless=new             --no-sandbox             --disable-dev-shm-usage             --enable-webgl             --enable-unsafe-swiftshader             --ignore-gpu-blocklist             --virtual-time-budget=18000             --dump-dom http://127.0.0.1:8000/             > /tmp/forest-dom.html 2> /tmp/forest-chrome.log

          if ! grep -q 'data-forest-boot="ready"' /tmp/forest-dom.html; then
            echo "Game did not reach the boot-ready marker."
            echo "--- HTTP log ---"; cat /tmp/forest-http.log
            echo "--- Chrome log ---"; cat /tmp/forest-chrome.log
            echo "--- DOM tail ---"; tail -n 80 /tmp/forest-dom.html
            exit 1
          fi
          echo "Forest Hunter browser boot smoke passed."

      - name: Diff hygiene
        run: git diff --check
